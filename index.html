<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis finanzas · Gise</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#1f2a44;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
  .wrap{width:min(440px,100%);text-align:center}
  h1{font-size:26px;margin:0 0 6px}
  p.sub{color:#6b7793;margin:0 0 28px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1px solid #e3e8f2;border-radius:16px;padding:20px 22px;margin:12px 0;box-shadow:0 6px 18px rgba(20,30,60,.06);color:inherit;transition:transform .1s}
  a.card:hover{transform:translateY(-2px)}
  .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  .ico.f{background:#e7ecff}
  .ico.c{background:#dced76}
  .t{text-align:left}
  .t b{display:block;font-size:17px}
  .t span{font-size:13px;color:#6b7793}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Mis finanzas 💠</h1>
    <p class="sub">Entrá con tu mail y contraseña en cada una.</p>
    <a class="card" href="facturacion.html">
      <div class="ico f">📄</div>
      <div class="t"><b>Gestión de Facturación</b><span>Facturas, cobros y obras sociales</span></div>
    </a>
    <a class="card" href="claro/index.html">
      <div class="ico c">💰</div>
      <div class="t"><b>Claro · Finanzas</b><span>Gastos, ahorro y el panorama general</span></div>
    </a>
  </div>
</body>
</html>
